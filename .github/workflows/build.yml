name: Build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # steamlayer is pulled from the private Gitea maven
      ORG_GRADLE_PROJECT_gitea_token: ${{ secrets.GITEA_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: voidheart-${{ github.sha }}
          path: build/libs/*.jar
