plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

base {
    archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

repositories {
    mavenLocal()
    maven {
        name = "Gitea"
        url = uri("https://git.ferenyr.fr/api/packages/VoidxelIndustries/maven")

        credentials(HttpHeaderCredentials) {
            name = "Authorization"
            value = "token ${gitea_token}"
        }

        authentication {
            header(HttpHeaderAuthentication)
        }
    }

    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Roughly Enough Items'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'YACL'
        url = 'https://maven.isxander.dev/releases'
    }
    maven {
        name = 'ModMenu'
        url = 'https://maven.terraformersmc.com/'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "net.voxelindustry:SteamLayer:${project.steamlayer_version}"
    implementation "maven.modrinth:geckolib:${project.geckolib_version}"

    implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
    compileOnly "me.shedaniel.cloth:basic-math:0.6.1"
    compileOnly "dev.architectury:architectury-fabric:22.0.3"
    compileOnly "maven.modrinth:iris:${project.iris_version}"
    implementation "maven.modrinth:jade:${project.jade_version}"

    compileOnly "org.projectlombok:lombok:${project.lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"

    testImplementation(platform('org.junit:junit-bom:5.13.4'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testImplementation('org.mockito:mockito-core:5.20.0')
    testImplementation('org.mockito:mockito-junit-jupiter:5.20.0')
    testImplementation('org.assertj:assertj-core:3.27.6')

    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

test {
    useJUnitPlatform()
}

loom {
    accessWidenerPath.set(file("src/main/resources/voidheart.accesswidener"))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact(jar) {
                builtBy jar
            }
        }
    }

    repositories {
        mavenLocal()
    }
}

jar {
    from "LICENSE"
}

fabricApi {
    configureDataGeneration {
        client = true
    }
    configureTests {
        createSourceSet = true
        modId = "voidheart-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
        clearRunDirectory = true
    }
}

// -PgameTest=ShatterForge runs only the client game tests whose class name contains that text
processGametestResources {
    def gameTest = project.findProperty("gameTest")
    inputs.property("gameTest", gameTest ?: "")

    doLast {
        if (!gameTest)
            return

        def file = new File(destinationDir, "fabric.mod.json")
        def mod = new groovy.json.JsonSlurper().parse(file)
        def selected = mod.entrypoints["fabric-client-gametest"].findAll { it.contains(gameTest) }
        if (selected.isEmpty())
            throw new GradleException("No client game test matches -PgameTest=${gameTest}")

        mod.entrypoints["fabric-client-gametest"] = selected
        file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(mod))
    }
}

processResources {
    inputs.properties "version": project.version, "description": project.description

    filesMatching(["fabric.mod.json", "pack.mcmeta"]) {
        expand(
                "version": project.version,
                "description": project.description,
                "repoOwner": project.repoOwner,
                "repoName": project.repoName,
                "id": project.modId,
                "minecraftVersionLimit": project.minecraftVersionLimit,
                "loaderVersionLimit": project.loaderVersionLimit
        )
    }
}